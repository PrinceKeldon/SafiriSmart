services:
  # Supabase PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: supabase_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase Auth Service (Optional for local development)
  supabase-auth:
    image: supabase/auth:latest
    container_name: supabase_auth
    environment:
      GOTRUE_JWT_SECRET: "super-secret-jwt-token-with-at-least-32-characters-long"
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DB_DRIVER: postgres
      DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/postgres"
      GOTRUE_SITE_URL: "http://localhost:5173"
      GOTRUE_URI_ALLOW_LIST: "localhost:5173"
    ports:
      - "9999:9999"
    depends_on:
      postgres:
        condition: service_healthy

  # Redis for caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: safiri_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # SafiriSmart AI Core: migration engine + LangGraph planning pipeline
  ai-core:
    build:
      context: .
      dockerfile: Dockerfile.ai-core
    container_name: safiri_ai
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      SUPABASE_URL: "${VITE_SUPABASE_URL}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      MIGRATION_SERVICE_KEY: "${MIGRATION_SERVICE_KEY:-dev-key-change-me}"
      PYTHONPATH: "/app"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./safirismart:/app/safirismart
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: safiri_network


version: '3.8'

services:
  # AI Core Service
  ai-core-service:
    build:
      context: ../ai-core-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_V1_STR=/api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # B2B Backend Service
  b2b-backend:
    build:
      context: ../b2b-backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AI_CORE_SERVICE_URL=http://ai-core-service:8000
      - AI_CORE_SERVICE_API_KEY=${AI_CORE_SERVICE_API_KEY}
      - SECRET_KEY=${JWT_SECRET}
      - EMAIL_HOST=${SMTP_HOST}
      - EMAIL_USER=${SMTP_USER}
      - EMAIL_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - ai-core-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl/certs
    depends_on:
      - ai-core-service
      - b2b-backend
    restart: unless-stopped

networks:
  default:
    driver: bridge

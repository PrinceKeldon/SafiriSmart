[project]
name = "safirismart"
version = "0.1.0"
description = "SafiriSmart backend services and migration intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["safirismart/migration_engine/tests"]
